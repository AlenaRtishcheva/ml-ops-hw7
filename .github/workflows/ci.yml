name: ML-Service-CI
on: [push]

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install scikit-learn pandas numpy fastapi uvicorn

      - name: Syntax and Model Check
        run: python -m py_compile ml_pipeline.py

      # Обеспечиваем воспроизводимость: сохраняем список библиотек как артефакт
      - name: Make pipeline reproducible
        uses: actions/upload-artifact@v4
        with:
          name: deployment-package-info
          path: requirements.txt